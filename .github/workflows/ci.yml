name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout driver
        uses: actions/checkout@v6
        with:
          path: ${{ github.workspace }}/driver
      - name: checkout metabase
        uses: actions/checkout@v6
        with:
          repository: metabase/metabase
          path: ${{ github.workspace }}/metabase
          ref: release-x.60.x
      - name: install java
        uses: actions/setup-java@v5
        with:
          distribution: 'adopt'
          java-version: '21'

      - name: Install clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          cli: 'latest'

      - name: Cache clojure dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ${{ github.workspace }}/metabase/.cpcache
          # List all files containing dependencies:
          key: cljdeps-${{ hashFiles('driver/deps.edn', 'metabase/deps.edn') }}
          # key: cljdeps-${{ hashFiles('deps.edn', 'bb.edn') }}
          # key: cljdeps-${{ hashFiles('project.clj') }}
          # key: cljdeps-${{ hashFiles('build.boot') }}
          restore-keys: cljdeps-

      - name: build driver
        run: |
          export DRIVER_PATH=${{ github.workspace }}/driver
          cd ${{ github.workspace }}/metabase
          clojure \
            -Sdeps "{:aliases {:greptimedb {:extra-deps {com.metabase/greptimedb-driver {:local/root \"$DRIVER_PATH\"}}}}}"  \
            -X:build:greptimedb \
            build-drivers.build-driver/build-driver! \
            "{:driver :greptimedb, :project-dir \"$DRIVER_PATH\", :target-dir \"$DRIVER_PATH/target\"}"
